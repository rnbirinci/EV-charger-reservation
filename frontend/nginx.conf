server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The CSP is the main defense-in-depth for the tokens we
    # keep in localStorage: scripts may only load from our own origin (no
    # inline scripts), so an injected <script> can't run. 'unsafe-inline' is
    # allowed for styles only because the app uses inline style attributes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    # API calls go to the backend container over the compose network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: any non-file route serves index.html.
    location / {
        try_files $uri /index.html;
    }
}
